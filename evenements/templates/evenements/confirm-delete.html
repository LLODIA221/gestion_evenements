{% extends 'base.html' %}
{% block title %}Supprimer l’événement{% endblock %}
{% block content %}

<h2>Supprimer l’événement ?</h2>
<p>Es-tu sûr de vouloir supprimer <strong>{{ object.titre }}</strong> ?</p>

<form method="post" id="delete-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'evenement_detail' object.pk %}" class="btn btn-secondary">Annuler</a>
</form>

<script>
    document.getElementById('delete-form').addEventListener('submit', function(event) {
        if (!confirm("Confirmer la suppression de cet événement ?")) {
            event.preventDefault();
        }
    });
</script>

{% endblock %}
